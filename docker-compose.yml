version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cricket_dna_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cricket_dna
      POSTGRES_USER: cricket_admin
      POSTGRES_PASSWORD: cricket_secret_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./artifacts/api-server/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricket_admin -d cricket_dna"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml_service
    container_name: cricket_dna_ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  postgres_data: