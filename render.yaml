# ============================================================
# Cricket DNA — Render Blueprint
# Deploys: PostgreSQL + Key Value (Redis) + ML service + API server
#
# Usage:
#   1. Push this file to the repo root
#   2. Render Dashboard → New → Blueprint → select this repo
#   3. Fill in the sync:false env vars when prompted
#   4. Frontend deploys separately on Vercel
# ============================================================

databases:
  - name: cricket-dna-postgres
    databaseName: cricket_dna
    user: cricket_admin
    plan: free

services:
  # ── Key Value store (Redis-compatible) ──────────────────────────────────────
  - type: keyvalue
    name: cricket-dna-redis
    plan: free
    ipAllowList: []

  # ── ML service (FastAPI, Docker) ────────────────────────────────────────────
  - type: web
    name: cricket-dna-ml
    runtime: docker
    dockerfilePath: artifacts/ml/Dockerfile
    dockerContext: artifacts/ml
    plan: free
    healthCheckPath: /health

  # ── API server (Node/Express) ───────────────────────────────────────────────
  - type: web
    name: cricket-dna-api
    runtime: node
    rootDir: artifacts/api-server
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    plan: free
    healthCheckPath: /health
    envVars:
      # ── Secrets — paste these in the Render dashboard ──
      - key: CRICDATA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false            # paste your Vercel URL after frontend deploys
      # ── Key Value (Redis) wiring ──
      - key: REDIS_HOST
        fromService:
          name: cricket-dna-redis
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: cricket-dna-redis
          type: keyvalue
          property: port
      - key: REDIS_PASSWORD
        fromService:
          name: cricket-dna-redis
          type: keyvalue
          property: password
      # ── Postgres wiring ──
      - key: POSTGRES_HOST
        fromDatabase:
          name: cricket-dna-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: cricket-dna-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: cricket-dna-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: cricket-dna-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: cricket-dna-postgres
          property: password
      # ── ML service wiring ──
      - key: ML_URL
        fromService:
          name: cricket-dna-ml
          type: web
          property: hostport
      # ── App config ──
      - key: NODE_ENV
        value: production
      - key: CRICDATA_DAILY_LIMIT
        value: "100"
      - key: KEEP_ALIVE_ENABLED
        value: "true"

  # ── One-time DB schema + seed (run manually after first deploy) ──────────────
  - type: worker
    name: cricket-dna-migrate
    runtime: node
    rootDir: artifacts/api-server
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm db:migrate
    plan: free
    autoDeploy: false
    envVars:
      - key: POSTGRES_HOST
        fromDatabase:
          name: cricket-dna-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: cricket-dna-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: cricket-dna-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: cricket-dna-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: cricket-dna-postgres
          property: password
