kind = "web"
previewPath = "/"
title = "Cricket DNA"
version = "1.0.0"
id = "artifacts/cricket-dna"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21706

[services.development]
run = "pnpm --filter @workspace/cricket-dna run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cricket-dna", "run", "build" ]
publicDir = "artifacts/cricket-dna/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21706"
BASE_PATH = "/"
